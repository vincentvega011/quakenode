[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quakenode"
version = "0.2.0"
description = "Research testbed for evaluating earthquake early warning detectors as causal streaming systems. Not an operational warning system."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuakeNode contributors" }]
keywords = ["earthquake early warning", "seismology", "streaming", "fault injection", "STA/LTA", "reproducibility", "testbed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/vincentvega011/quakenode"
Repository = "https://github.com/vincentvega011/quakenode"
Issues = "https://github.com/vincentvega011/quakenode/issues"
Changelog = "https://github.com/vincentvega011/quakenode/blob/main/CHANGELOG.md"

[project.scripts]
quakenode = "quakenode.cli:main"

[project.optional-dependencies]
# plots: matplotlib figures in reports. data: real recorded-event adapters (INSTANCE HDF5 / miniSEED); not needed
# for the SYNTHETIC workflow. dev: tests and linting.
dev = ["pytest", "ruff>=0.17,<0.18"]
data = ["numpy", "h5py", "obspy"]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quakenode = ["demo_data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]  # zip() truncation is intended in the prefix comparisons
